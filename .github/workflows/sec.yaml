name: Security

on:
  push:
    branches: '**'

permissions:
  contents: write

jobs:
  sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Scan Dependencies
        run: make sec
